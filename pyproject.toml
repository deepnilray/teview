[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "teview-evidence-core"
version = "0.5.2a0"
description = "Composable physical experiments, reproducible computation, and offline visualization"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
authors = [{name = "TEVIEW Contributors"}]
dependencies = []

[project.scripts]
tev = "tev:main"
teview = "teview_desktop:main"

[tool.setuptools]
py-modules = ["tev", "teview_gate", "teview_starter", "teview_capture", "teview_physics", "teview_accuracy", "teview_visual", "teview_visual_template", "teview_desktop", "teview_executable"]

[tool.setuptools.package-data]
teview_examples = ["*.tev"]

[tool.setuptools.packages.find]
include = ["teview_examples"]
