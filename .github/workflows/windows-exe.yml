name: Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out TEVIEW
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Test installed launcher
        shell: pwsh
        run: teview --smoke-test --workspace "$env:RUNNER_TEMP\teview-pip-check" --no-browser
      - name: Build standalone executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name TEVIEW `
            --collect-data teview_examples `
            --hidden-import teview_accuracy `
            --hidden-import teview_visual `
            --hidden-import teview_visual_template `
            teview_executable.py
      - name: Verify executable without using system Python
        shell: pwsh
        run: |
          & .\dist\TEVIEW.exe --smoke-test --workspace "$env:RUNNER_TEMP\teview-exe-check" --no-browser
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\TEVIEW.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path portable -Force | Out-Null
          Copy-Item dist\TEVIEW.exe portable\TEVIEW.exe
          Copy-Item docs\INSTALL_WINDOWS.md portable\README.txt
          Compress-Archive -Path portable\* -DestinationPath TEVIEW-Windows-x64.zip -Force
          Get-FileHash TEVIEW-Windows-x64.zip -Algorithm SHA256 | Format-List
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: TEVIEW-Windows-x64
          path: TEVIEW-Windows-x64.zip
          retention-days: 30
