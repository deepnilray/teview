name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the CLI
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Protocol validation
        run: tev validate examples/ab_test/experiment.tev
      - name: Execute example
        run: tev run examples/ab_test/experiment.tev --out results/ci-ab
      - name: Verify replay
        run: tev verify results/ci-ab
      - name: Trusted local plugin example
        run: tev run examples/physics/experiment.tev --out results/ci-physics --allow-python
      - name: Verify trusted example
        run: tev verify results/ci-physics --allow-python

      - name: Capture existing command-line experiment
        run: tev capture --root examples/command --out results/ci-capture --code integrate.py --data measurements.csv -- python integrate.py
      - name: Replay captured command
        run: tev verify results/ci-capture
      - name: Gate captured evidence with verified replay
        run: tev gate results/ci-capture results/ci-capture --policy examples/command/gate.toml --verify-evidence

      - name: Validate composable physical scenes
        run: |
          tev scene-check examples/scenes/electrothermal.tev
          tev scene-check examples/scenes/ball_water_spring.tev
      - name: Simulate independently composed components
        run: tev simulate examples/scenes/electrothermal.tev --out results/ci-lamp
      - name: Verify physical scene replay
        run: tev scene-verify results/ci-lamp
